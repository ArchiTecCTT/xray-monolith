name: Issue 668 - DX8 AVX diagnostic baseline

# Isolated fork-only build. No default-branch pushes, PR builds, releases,
# artifact cleanup jobs, repository writes, or game-data uploads.
on:
  push:
    branches:
      - issue-668-diagnostics-2026.8.17

permissions:
  contents: read

concurrency:
  group: issue-668-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'ArchiTecCTT/xray-monolith'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the exact diagnostic revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify that engine changes are diagnostic-only
        run: ./tools/issue-668/verify-diagnostics.ps1

      - name: Locate Visual Studio 2022 C++ build tools
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) {
            throw 'Visual Studio 2022 C++ tools were not found on the runner.'
          }
          $msbuild = Join-Path $vs 'MSBuild/Current/Bin/amd64/MSBuild.exe'
          if (-not (Test-Path -LiteralPath $msbuild)) {
            throw "64-bit MSBuild was not found at $msbuild"
          }
          $mfcHeaders = @(Get-ChildItem -Path (Join-Path $vs 'VC/Tools/MSVC/*/atlmfc/include/afx.h'))
          if ($mfcHeaders.Count -eq 0) {
            throw 'The runner needs the Visual Studio C++ ATL/MFC components before this engine can build.'
          }
          "MSBUILD_EXE=$msbuild" | Add-Content -LiteralPath $env:GITHUB_ENV
          New-Item -ItemType Directory -Path build-668 -Force | Out-Null
          & $msbuild -version -nologo | Set-Content build-668/toolchain.txt
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild version check failed.' }

      - name: Build stable DX8-AVX only
        run: |
          & $env:MSBUILD_EXE src/engine-vs2022.sln /nologo /m:1 /p:Configuration=DX8-AVX /p:Platform=x64 /p:CL_MPCount=2 /verbosity:minimal '/flp:logfile=build-668/msbuild.log;verbosity=normal'
          if ($LASTEXITCODE -ne 0) {
            throw "DX8-AVX build failed with exit code $LASTEXITCODE. See the build log artifact."
          }

      - name: Package the diagnostic baseline with provenance
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = '_build/_game/bin_dbg/AnomalyDX8AVX.exe'
          $pdb = '_build/_game/bin_dbg/AnomalyDX8AVX.pdb'
          foreach ($file in @($exe, $pdb)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Expected build output is missing: $file" }
          }
          New-Item -ItemType Directory -Path package/bin -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination package/bin/
          Copy-Item -LiteralPath License.txt, ISSUE-668-TESTING.md -Destination package/
          Copy-Item -LiteralPath build-668/toolchain.txt -Destination package/
          $manifest = [ordered]@{
            mode = 'diagnostic-baseline-not-a-fix'
            upstream = 'themrdemonized/xray-monolith'
            upstreamTag = '2026.8.17'
            upstreamCommit = '62cb33722793166f3454a5ba08e03c67279f4ef8'
            sourceCommit = $env:GITHUB_SHA
            configuration = 'DX8-AVX'
            multithreadedBranch = $false
            diagnosticArgument = '-corpse_debug'
            diagnosticPrefix = '[DEBUG-668]'
            runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            exeSha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            pdbSha256 = (Get-FileHash -LiteralPath $pdb -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath package/build-manifest.json -Encoding utf8
          @(
            '## Diagnostic baseline built'
            ''
            'Configuration: **DX8-AVX**, stable **2026.8.17**. This is not the fix.'
            "Source: ``$env:GITHUB_SHA``"
            "Executable SHA-256: ``$($manifest.exeSha256)``"
            ''
            'Download the baseline artifact for the executable and test instructions. Symbols are optional and separate.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload the baseline executable and instructions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-668-baseline-DX8-AVX-${{ github.run_number }}
          path: package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload optional debug symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-668-baseline-DX8-AVX-symbols-${{ github.run_number }}
          path: _build/_game/bin_dbg/AnomalyDX8AVX.pdb
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-668-build-logs-${{ github.run_number }}
          path: build-668/
          if-no-files-found: warn
          retention-days: 7
