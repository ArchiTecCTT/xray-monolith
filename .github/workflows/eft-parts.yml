name: eft-parts

# Test build of the EFT-parts script setters (branch eft-parts-engine). Builds DX8-AVX only.
# Same steps as svp-lite.yml (copied from the svp-lite-mt branch). Short-lived artifacts only: no releases, no secrets,
# no artifact cleanup. Runs on a push of eft-parts-engine and by hand (Actions > eft-parts > Run workflow, pick the branch).

on:
  push:
    branches: [eft-parts-engine, svp-lite-mt-parts, svp-lite-mt-parts-canted, svp-lite-mt-parts-aimsettle, svp-lite-mt-parts-zero, svp-lite-mt-parts-zero-texfix, r1-ps3-lum-adapt, r1-sm3-detect, r1-svp-lens, r1-lum-readback, r1-svp-zoom, r1-unload-purge, sync-upstream-2026-11, headphones-audio, headphones-compressor, headphones-autogain, headphones-soundtypes, npc-reload-types, crash-diagnostics, r1-thermal, look-speed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # the standalone math checks in tests/ (no engine build; g++ on Linux, a few seconds)
    name: lens math tests
    if: github.repository == 'ArchiTecCTT/xray-monolith'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: svp_lens_test, svp_lens_zoom_test, audio_mix_test and look_speed_test
        run: |
          set -e
          for t in svp_lens_test svp_lens_zoom_test audio_mix_test look_speed_test; do
            g++ -std=c++17 -g -Wall -fsanitize=address,undefined "tests/$t.cpp" -o "/tmp/$t"
            "/tmp/$t" .
          done

  shaders:
    # R1 compiles its shaders on the player's PC when they are first used, and a shader error there stops the game.
    # This compiles the R1 thermal shader files (docs/r1_thermal.md) with the Windows SDK's fxc for every skinning
    # mode, against the stock R1 headers they include (taken from a public copy of the vanilla game data at a fixed
    # commit; the engine repo does not ship them). No engine build, about a minute. The game itself uses the older
    # D3DX compiler, so this catches errors in the files, it is not the game's own compile.
    name: r1 thermal shader compile
    if: github.repository == 'ArchiTecCTT/xray-monolith'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Compile the R1 thermal shader files
        run: |
          $ErrorActionPreference = 'Stop'
          $fxc = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Recurse -Filter fxc.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $fxc) { throw 'fxc.exe not found in the Windows SDK' }
          Write-Host "fxc: $($fxc.FullName)"

          $work = Join-Path $env:RUNNER_TEMP 'r1'
          New-Item -ItemType Directory -Path (Join-Path $work 'shared') -Force | Out-Null
          $stock = 'https://raw.githubusercontent.com/Tosox/STALKER-Anomaly-gamedata/6187cf7131134ca196feb3e1ecde7cded17ffb0b/gamedata/shaders/r1'
          foreach ($f in 'common.h', 'skin.h', 'skin_main.h', 'shared/common.h', 'model_def_hq.vs', 'model_def_lq.vs') {
            Invoke-WebRequest -Uri "$stock/$f" -OutFile (Join-Path $work $f)
          }
          $pixel = 'heat_mask.ps', 'heat_flat.ps', 'heat_particle.ps', 'heat_spot.ps', 'heat_shadow.ps', 'thermal_noise.ps', 'thermal_down.ps', 'thermal_blur.ps',
            'thermal_look.ps', 'thermal_palette.ps', 'thermal_show.ps', 'thermal_show_region.ps'
          $skinned = 'heat_mask.vs', 'heat_mask_lq.vs', 'ui_icons.vs'
          $plain = @('heat_particle.vs', 'heat_shadow.vs')
          foreach ($f in ($pixel + $skinned + $plain)) { Copy-Item (Join-Path 'gamedata\shaders\r1' $f) $work }
          Set-Location $work

          # R1 picks the entry point by searching the whole file text, comments included: these files must use "main"
          foreach ($f in ($pixel + $skinned + $plain)) {
            if (Select-String -Path $f -Pattern 'main_(ps|vs)_\d_\d' -Quiet) { throw "$f names a main_ps_x_y / main_vs_x_y entry" }
          }

          $failed = @()
          $judged = 0
          function Compile([string]$file, [string]$target, [string]$skin) {
            $out = [IO.Path]::GetFileNameWithoutExtension($file) + '_' + $target + '_' + $skin
            # /Zpr = D3DXSHADER_PACKMATRIX_ROWMAJOR, the flag the engine compiles with. /Gec = accept what the game's
            # older compiler accepts (the stock headers declare 'half' globals, which fxc otherwise refuses in vs_2_0)
            $fxcArgs = @('/nologo', '/Zpr', '/Gec', '/T', $target, '/E', 'main', '/D', 'SHADER_BUS=7', '/Fo', "$out.o", '/Fc', "$out.asm")
            if ($skin -ne 'none') { $fxcArgs += @('/D', "$skin=1") }
            $fxcArgs += $file
            $text = (& $fxc.FullName @fxcArgs 2>&1 | Out-String)
            $ok = ($LASTEXITCODE -eq 0)
            Write-Host ("{0}  {1} {2} {3}" -f $(if ($ok) { 'ok    ' } else { 'FAILED' }), $file, $target, $skin)
            if (-not $ok) { $text -split "`n" | Where-Object { $_ -notmatch 'warning X' -and $_.Trim() } | ForEach-Object { Write-Host $_ } }
            return $ok
          }

          foreach ($ps in $pixel) {
            if (-not (Compile $ps 'ps_2_0' 'none')) { $failed += $ps }
          }
          foreach ($vs in $plain) {
            if (-not (Compile $vs 'vs_2_0' 'none')) { $failed += $vs }
          }
          foreach ($skin in 'SKIN_NONE', 'SKIN_0', 'SKIN_1', 'SKIN_2', 'SKIN_3', 'SKIN_4') {
            # the stock model shaders are the control: if fxc cannot build them for this mode, the mode is not judged
            $control = (Compile 'model_def_hq.vs' 'vs_2_0' $skin) -and (Compile 'model_def_lq.vs' 'vs_2_0' $skin)
            foreach ($vs in $skinned) {
              $ok = Compile $vs 'vs_2_0' $skin
              if ($control) { $judged++ }
              if (-not $ok -and $control) { $failed += "$vs $skin" }
              if (-not $ok -and -not $control) { Write-Host "::warning::$vs $skin not judged: the stock model shaders do not build with fxc for this mode either" }
            }
          }

          # for reading: the position code of the scene's vertex shaders next to the heat ones (two-bone meshes), and
          # every pixel shader (its last comment line counts the instructions; ps_2_0 allows 32 texture + 64 others)
          $show = @('model_def_hq_vs_2_0_SKIN_2.asm', 'heat_mask_vs_2_0_SKIN_2.asm', 'model_def_lq_vs_2_0_SKIN_2.asm', 'heat_mask_lq_vs_2_0_SKIN_2.asm', 'heat_particle_vs_2_0_none.asm')
          $show += $pixel | ForEach-Object { [IO.Path]::GetFileNameWithoutExtension($_) + '_ps_2_0_none.asm' }
          foreach ($f in $show) {
            if (Test-Path $f) { Write-Host "::group::$f"; Get-Content $f | Write-Host; Write-Host '::endgroup::' }
          }
          foreach ($ps in $pixel) {
            $asm = [IO.Path]::GetFileNameWithoutExtension($ps) + '_ps_2_0_none.asm'
            if (Test-Path $asm) { Write-Host ("{0,-24} {1}" -f $ps, ((Select-String -Path $asm -Pattern 'instruction slots used').Line)) }
          }

          if ($failed.Count) { throw ("shader compile failed: " + ($failed -join ', ')) }
          if ($judged -ne 18) { throw "only $judged of 18 vertex shader builds could be judged" }
          Write-Host 'All R1 thermal shader files compile (12 pixel shaders, 2 plain vertex shaders, 3 vertex shaders in 6 skinning modes).'
          exit 0

  build:
    name: build ${{ matrix.buildconf }}
    if: github.repository == 'ArchiTecCTT/xray-monolith'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        buildconf: [DX8-AVX]

    steps:
      - name: Checkout (with submodules)
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false

      - name: Locate Visual Studio 2022 and check ATL/MFC
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $vs = & $vswhere -latest -products * -version '[17.0,18.0)' -property installationPath
          if (-not $vs) { throw 'Visual Studio 2022 not found' }
          Write-Host "Visual Studio 2022: $vs"
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          if (-not (Test-Path $msbuild)) { throw "MSBuild (amd64) not found at $msbuild" }
          $afx = Get-ChildItem -Path (Join-Path $vs 'VC\Tools\MSVC') -Recurse -Filter afx.h -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $afx) { throw 'ATL/MFC header afx.h not found in this Visual Studio install' }
          Write-Host "afx.h: $($afx.FullName)"
          Write-Host "MSBuild: $msbuild"
          "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build ${{ matrix.buildconf }}
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:GITHUB_WORKSPACE 'msbuild-${{ matrix.buildconf }}.log'
          & $env:MSBUILD_EXE src/engine-vs2022.sln /nologo /m:1 /p:Configuration=${{ matrix.buildconf }} /p:Platform=x64 /p:CL_MPCount=2 /fl "/flp:LogFile=$log;Verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Collect exe, manifest and log
        run: |
          $ErrorActionPreference = 'Stop'
          $conf = '${{ matrix.buildconf }}'
          $exeName = 'Anomaly' + ($conf -replace '-', '') + '.exe'
          $bin = Join-Path $env:GITHUB_WORKSPACE '_build\_game\bin_dbg'
          Write-Host "Contents of ${bin}:"
          Get-ChildItem $bin | ForEach-Object { Write-Host ("  {0}  {1} bytes" -f $_.Name, $_.Length) }
          $exe = Join-Path $bin $exeName
          if (-not (Test-Path $exe)) { throw "Expected build output not found: $exe" }
          $stage = Join-Path $env:GITHUB_WORKSPACE 'staging'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $exe $stage
          # The symbol file, so a crash dump of this exe can be read by function name. It is not needed to play.
          $pdb = [IO.Path]::ChangeExtension($exe, '.pdb')
          $pdbStage = Join-Path $env:GITHUB_WORKSPACE 'staging-pdb'
          New-Item -ItemType Directory -Path $pdbStage -Force | Out-Null
          if (Test-Path $pdb) { Copy-Item $pdb $pdbStage } else { Write-Host "::warning::No PDB found at $pdb" }
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'msbuild-${{ matrix.buildconf }}.log') $stage
          $sha = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{
            sourceCommit  = $env:GITHUB_SHA
            branch        = $env:GITHUB_REF_NAME
            configuration = $conf
            exe           = $exeName
            sha256        = $sha
          }
          $manifest | ConvertTo-Json | Set-Content -Path (Join-Path $stage 'build-manifest.json') -Encoding utf8
          Get-Content (Join-Path $stage 'build-manifest.json')

      - name: Upload exe, manifest and log
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ${{ matrix.buildconf }}-exe-${{ github.ref_name }}
          path: staging/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload symbol file (PDB)
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ${{ matrix.buildconf }}-pdb-${{ github.ref_name }}
          path: staging-pdb/*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log (failed build)
        if: failure()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ${{ matrix.buildconf }}-buildlog-${{ github.ref_name }}
          path: msbuild-${{ matrix.buildconf }}.log
          if-no-files-found: warn
          retention-days: 7
